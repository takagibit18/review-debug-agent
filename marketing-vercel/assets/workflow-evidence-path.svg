<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" role="img" aria-label="Workflow evidence path">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#203a5c" flood-opacity=".11"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0l7 3-7 3z" fill="#2f6fb3"/>
    </marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#2f6fb3" opacity=".08"/>
    </pattern>
  </defs>
  <rect width="1280" height="620" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="620" fill="url(#dots)"/>
  <text x="58" y="64" fill="#0b1220" font-family="Inter,Segoe UI,sans-serif" font-size="20" font-weight="850">GitHub-native evidence path</text>
  <text x="58" y="96" fill="#5c6a7e" font-family="Inter,Segoe UI,sans-serif" font-size="14">Diff-first review, changed-line eligibility, reproducible artifacts, neutral publishing.</text>

  <g font-family="Inter,Segoe UI,sans-serif">
    <g filter="url(#shadow)">
      <rect x="58" y="158" width="204" height="292" rx="18" fill="#fff" stroke="#3c5b82" stroke-opacity=".18"/>
      <rect x="82" y="186" width="52" height="30" rx="8" fill="#dbeaff"/>
      <text x="98" y="207" fill="#2f6fb3" font-size="13" font-weight="900">01</text>
      <text x="82" y="250" fill="#0b1220" font-size="21" font-weight="850">PR diff</text>
      <text x="82" y="286" fill="#5c6a7e" font-size="14">Changed files and hunks are the review target.</text>
      <path d="M82 338h138M82 370h118M82 402h148" stroke="#2f6fb3" stroke-opacity=".18" stroke-width="12" stroke-linecap="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="306" y="158" width="204" height="292" rx="18" fill="#fff" stroke="#3c5b82" stroke-opacity=".18"/>
      <rect x="330" y="186" width="52" height="30" rx="8" fill="#dbeaff"/>
      <text x="346" y="207" fill="#2f6fb3" font-size="13" font-weight="900">02</text>
      <text x="330" y="250" fill="#0b1220" font-size="20" font-weight="850">changed_lines.json</text>
      <text x="330" y="286" fill="#5c6a7e" font-size="14">Only eligible lines can receive inline comments.</text>
      <rect x="330" y="336" width="142" height="34" rx="9" fill="#e8f3e6"/>
      <text x="352" y="358" fill="#315b35" font-size="13" font-weight="800">line eligible</text>
      <rect x="330" y="388" width="122" height="34" rx="9" fill="#f3f7fc"/>
      <text x="352" y="410" fill="#5c6a7e" font-size="13" font-weight="800">context only</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="554" y="158" width="204" height="292" rx="18" fill="#0b1220"/>
      <rect x="578" y="186" width="52" height="30" rx="8" fill="#dbeaff"/>
      <text x="594" y="207" fill="#2f6fb3" font-size="13" font-weight="900">03</text>
      <text x="578" y="250" fill="#fff" font-size="19" font-weight="850">review_response</text>
      <text x="578" y="286" fill="#b7c7da" font-size="14">Issues carry severity, evidence, suggestion, and confidence.</text>
      <path d="M578 338h132M578 370h106M578 402h146" stroke="#fff" stroke-opacity=".16" stroke-width="12" stroke-linecap="round"/>
      <path d="M578 370h78" stroke="#6f9ed0" stroke-width="12" stroke-linecap="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="802" y="158" width="204" height="292" rx="18" fill="#fff" stroke="#3c5b82" stroke-opacity=".18"/>
      <rect x="826" y="186" width="52" height="30" rx="8" fill="#fff4dd"/>
      <text x="842" y="207" fill="#c48a2c" font-size="13" font-weight="900">04</text>
      <text x="826" y="250" fill="#0b1220" font-size="20" font-weight="850">run_summary</text>
      <text x="826" y="286" fill="#5c6a7e" font-size="14">Model, tools, tokens, stop reason, and publish status remain inspectable.</text>
      <rect x="826" y="346" width="72" height="30" rx="8" fill="#dbeaff"/>
      <rect x="910" y="346" width="58" height="30" rx="8" fill="#fff4dd"/>
      <rect x="826" y="392" width="132" height="30" rx="8" fill="#e8f3e6"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="1050" y="158" width="172" height="292" rx="18" fill="#eff6ff" stroke="#6f9ed0" stroke-opacity=".42"/>
      <rect x="1074" y="186" width="52" height="30" rx="8" fill="#2f6fb3"/>
      <text x="1090" y="207" fill="#fff" font-size="13" font-weight="900">05</text>
      <text x="1074" y="250" fill="#0b1220" font-size="20" font-weight="850">publish</text>
      <text x="1074" y="286" fill="#5c6a7e" font-size="14">Neutral check and advisory comments go back to the PR.</text>
      <rect x="1074" y="354" width="112" height="34" rx="9" fill="#2f6fb3"/>
      <text x="1097" y="376" fill="#fff" font-size="13" font-weight="850">neutral</text>
    </g>
  </g>

  <g stroke="#2f6fb3" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)" opacity=".75">
    <path d="M262 304H298"/>
    <path d="M510 304H546"/>
    <path d="M758 304H794"/>
    <path d="M1006 304H1042"/>
  </g>

  <rect x="200" y="510" width="880" height="52" rx="14" fill="#fff" stroke="#3c5b82" stroke-opacity=".16"/>
  <text x="230" y="542" fill="#0b1220" font-family="Inter,Segoe UI,sans-serif" font-size="14" font-weight="800">Contract:</text>
  <text x="310" y="542" fill="#5c6a7e" font-family="Inter,Segoe UI,sans-serif" font-size="14">comments stay on changed lines; findings outside changed hunks stay in the neutral check summary.</text>
</svg>
