    <text x="286" y="454" fill="#101014" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="850">收集证据</text>
    <text x="286" y="484" fill="#676b74" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">read-only tools</text>
    <path d="M326 274h88M326 314h70M326 354h104" stroke="#fff" stroke-opacity=".24" stroke-width="15" stroke-linecap="round"/>
