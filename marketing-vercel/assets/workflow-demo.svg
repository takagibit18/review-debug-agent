    <text x="58" y="484" fill="#676b74" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">changed_lines.json</text>
    <rect x="84" y="250" width="112" height="12" rx="6" fill="#101014" opacity=".14"/>
