    <text x="514" y="454" fill="#101014" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="850">结构化 finding</text>
    <text x="514" y="484" fill="#676b74" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">severity / evidence</text>
    <rect x="542" y="258" width="86" height="24" rx="8" fill="#ffcc8a"/>
