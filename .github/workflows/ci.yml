name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: python -m pip install "ruff>=0.4"

      - name: Lint with Ruff
        run: python -m ruff check .

  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run offline test suite
        env:
          CI: "true"
        run: python -m pytest -q

  container-smoke:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - uses: actions/checkout@v6

      - name: Build API image
        run: docker build --tag mergewarden:ci .

      - name: Start API container
        run: |
          docker run --detach --name mergewarden-api-smoke \
            --publish 127.0.0.1:18000:8000 \
            --env PLATFORM_DATABASE_URL=sqlite:////tmp/platform.db \
            --env PLATFORM_ARTIFACT_ROOT=/tmp/platform-artifacts \
            --env PLATFORM_PUBLIC_GITHUB_APP_ONLY=true \
            --env GITHUB_WEBHOOK_SECRET=offline-smoke-secret \
            mergewarden:ci \
            uvicorn src.api.app:app --host 0.0.0.0 --port 8000

      - name: Verify API liveness
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs mergewarden-api-smoke
          exit 1

      - name: Stop API container
        if: always()
        run: docker rm --force mergewarden-api-smoke || true
