<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" role="img" aria-label="Proof artifact strip">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6ff"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#203a5c" flood-opacity=".11"/>
    </filter>
  </defs>
  <rect width="1280" height="560" rx="20" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,sans-serif">
    <text x="58" y="64" fill="#0b1220" font-size="20" font-weight="850">Proof artifacts</text>
    <text x="58" y="96" fill="#5c6a7e" font-size="14">A soft check is useful only when teams can inspect how it was produced.</text>

    <g filter="url(#shadow)">
      <rect x="58" y="146" width="266" height="266" rx="18" fill="#fff" stroke="#3c5b82" stroke-opacity=".18"/>
      <rect x="86" y="174" width="52" height="34" rx="9" fill="#dbeaff"/>
      <text x="103" y="197" fill="#2f6fb3" font-size="13" font-weight="900">A</text>
      <text x="86" y="246" fill="#0b1220" font-size="20" font-weight="850">Changed-line eligible</text>
      <text x="86" y="286" fill="#5c6a7e" font-size="14">Inline comments map to changed hunks, not arbitrary repository files.</text>
      <rect x="86" y="344" width="196" height="34" rx="9" fill="#e8f3e6"/>
      <text x="112" y="366" fill="#315b35" font-size="13" font-weight="850">eligible comment target</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="366" y="146" width="266" height="266" rx="18" fill="#0b1220"/>
      <rect x="394" y="174" width="52" height="34" rx="9" fill="#dbeaff"/>
      <text x="411" y="197" fill="#2f6fb3" font-size="13" font-weight="900">B</text>
      <text x="394" y="246" fill="#fff" font-size="20" font-weight="850">Run summary</text>
      <text x="394" y="286" fill="#b7c7da" font-size="14">Models, tool calls, token totals, stop reasons, and publish status.</text>
      <path d="M394 344h178M394 374h132" stroke="#fff" stroke-opacity=".16" stroke-width="12" stroke-linecap="round"/>
      <path d="M394 374h92" stroke="#6f9ed0" stroke-width="12" stroke-linecap="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="674" y="146" width="266" height="266" rx="18" fill="#fff" stroke="#3c5b82" stroke-opacity=".18"/>
      <rect x="702" y="174" width="52" height="34" rx="9" fill="#fff4dd"/>
      <text x="719" y="197" fill="#c48a2c" font-size="13" font-weight="900">C</text>
      <text x="702" y="246" fill="#0b1220" font-size="20" font-weight="850">Fingerprint lifecycle</text>
      <text x="702" y="286" fill="#5c6a7e" font-size="14">Repeated runs update matching advisory comments and mark stale findings.</text>
      <rect x="702" y="344" width="74" height="34" rx="9" fill="#dbeaff"/>
      <text x="720" y="366" fill="#2f6fb3" font-size="13" font-weight="850">same</text>
      <rect x="790" y="344" width="86" height="34" rx="9" fill="#fff4dd"/>
      <text x="808" y="366" fill="#c48a2c" font-size="13" font-weight="850">stale</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="982" y="146" width="240" height="266" rx="18" fill="#eff6ff" stroke="#6f9ed0" stroke-opacity=".42"/>
      <rect x="1010" y="174" width="52" height="34" rx="9" fill="#2f6fb3"/>
      <text x="1027" y="197" fill="#fff" font-size="13" font-weight="900">D</text>
      <text x="1010" y="246" fill="#0b1220" font-size="20" font-weight="850">Neutral check</text>
      <text x="1010" y="286" fill="#5c6a7e" font-size="14">Risk signal without claiming merge authority.</text>
      <circle cx="1032" cy="356" r="16" fill="#5f9d57"/>
      <path d="M1024 356l6 6 13-17" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1062" y="361" fill="#0b1220" font-size="14" font-weight="850">CI keeps the gate</text>
    </g>
  </g>

  <path d="M324 280H356M632 280H664M940 280H972" stroke="#2f6fb3" stroke-width="3" stroke-linecap="round" stroke-dasharray="8 8" opacity=".62"/>
  <rect x="220" y="468" width="840" height="42" rx="12" fill="#fff" stroke="#3c5b82" stroke-opacity=".16"/>
  <text x="250" y="495" fill="#5c6a7e" font-family="Inter,Segoe UI,sans-serif" font-size="14">Outcome: reviewers see what changed, what evidence exists, and why the advisory stays soft.</text>
</svg>
