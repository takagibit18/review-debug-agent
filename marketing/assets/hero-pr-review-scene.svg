<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 720" role="img" aria-label="GitHub pull request advisory scene">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#edf5ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f7fbff"/>
    </linearGradient>
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#203a5c" flood-opacity="0.14"/>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0v30" fill="none" stroke="#2f6fb3" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="980" height="720" rx="22" fill="url(#bg)"/>
  <rect width="980" height="720" fill="url(#grid)"/>

  <g filter="url(#shadow)">
    <rect x="58" y="54" width="864" height="590" rx="22" fill="#fff" stroke="#3c5b82" stroke-opacity=".18"/>
    <rect x="58" y="54" width="864" height="66" rx="22" fill="#0b1220"/>
    <rect x="58" y="98" width="864" height="22" fill="#0b1220"/>
    <circle cx="92" cy="86" r="7" fill="#6f9ed0"/>
    <circle cx="116" cy="86" r="7" fill="#5f9d57"/>
    <circle cx="140" cy="86" r="7" fill="#c48a2c"/>
    <text x="176" y="92" fill="#e8f2ff" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="700">pull request #128 / checkout-risk</text>
    <rect x="706" y="72" width="168" height="30" rx="9" fill="#dbeaff"/>
    <text x="734" y="92" fill="#2f6fb3" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="800">neutral advisory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="94" y="154" width="380" height="422" rx="16" fill="url(#panel)" stroke="#3c5b82" stroke-opacity=".16"/>
    <text x="124" y="190" fill="#0b1220" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="800">src/auth/session.ts</text>
    <text x="124" y="222" fill="#5c6a7e" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="700">changed hunk</text>
    <g font-family="SFMono-Regular,Consolas,monospace" font-size="13">
      <rect x="122" y="250" width="312" height="28" rx="7" fill="#f2f6fc"/>
      <text x="140" y="269" fill="#5c6a7e">44  if (!session) return redirect()</text>
      <rect x="122" y="288" width="312" height="28" rx="7" fill="#e8f3e6"/>
      <text x="140" y="307" fill="#315b35">45 + const role = await cache.get(user.id)</text>
      <rect x="122" y="326" width="312" height="28" rx="7" fill="#fff4dd"/>
      <text x="140" y="345" fill="#7c5519">46 + return role || "member"</text>
      <rect x="122" y="364" width="280" height="28" rx="7" fill="#f2f6fc"/>
      <text x="140" y="383" fill="#5c6a7e">47  audit.log("session:checked")</text>
    </g>
    <path d="M124 436h212M124 466h272M124 496h188" stroke="#2f6fb3" stroke-opacity=".18" stroke-width="10" stroke-linecap="round"/>
    <rect x="124" y="524" width="148" height="28" rx="8" fill="#dbeaff"/>
    <text x="146" y="543" fill="#2f6fb3" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="800">changed-line eligible</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="516" y="154" width="370" height="148" rx="16" fill="#eff6ff" stroke="#6f9ed0" stroke-opacity=".42"/>
    <rect x="544" y="184" width="46" height="30" rx="8" fill="#2f6fb3"/>
    <text x="558" y="204" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="900">01</text>
    <text x="610" y="199" fill="#0b1220" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="800">Changed-line comment</text>
    <text x="610" y="232" fill="#5c6a7e" font-family="Inter,Segoe UI,sans-serif" font-size="14">Role fallback changed. Verify default permission before merge.</text>
    <path d="M610 262h210" stroke="#2f6fb3" stroke-opacity=".2" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="516" y="330" width="370" height="148" rx="16" fill="#fff8e8" stroke="#c48a2c" stroke-opacity=".35"/>
    <rect x="544" y="360" width="46" height="30" rx="8" fill="#c48a2c"/>
    <text x="558" y="380" fill="#fff" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="900">02</text>
    <text x="610" y="375" fill="#0b1220" font-family="Inter,Segoe UI,sans-serif" font-size="17" font-weight="800">Evidence summary</text>
    <text x="610" y="408" fill="#5c6a7e" font-family="Inter,Segoe UI,sans-serif" font-size="14">Linked to tests, changed_lines.json, and run summary artifacts.</text>
    <path d="M610 438h236" stroke="#c48a2c" stroke-opacity=".22" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="516" y="506" width="370" height="70" rx="16" fill="#fff" stroke="#3c5b82" stroke-opacity=".18"/>
    <circle cx="552" cy="541" r="14" fill="#5f9d57"/>
    <path d="M545 541l5 5 10-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="580" y="545" fill="#0b1220" font-family="Inter,Segoe UI,sans-serif" font-size="15" font-weight="800">CI and branch protection keep final authority.</text>
  </g>

  <path d="M470 336C500 336 496 226 516 226" fill="none" stroke="#2f6fb3" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
  <path d="M470 346C502 346 498 402 516 402" fill="none" stroke="#c48a2c" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
</svg>
