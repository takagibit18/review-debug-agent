<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Proof demo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafbfc"/>
      <stop offset="0.5" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#eee9f6"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b24"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-10%" width="116%" height="126%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#15161d" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadowDark" x="-8%" y="-10%" width="116%" height="126%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#15161d" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2736ee"/>
    </marker>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#101014" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" fill="url(#bgGrad)"/>
  <rect width="1200" height="560" fill="url(#dots)"/>

  <ellipse cx="200" cy="500" rx="200" ry="80" fill="#ddd5e9" opacity="0.1"/>
  <ellipse cx="1000" cy="100" rx="180" ry="70" fill="#c8ff62" opacity="0.07"/>

  <text x="52" y="56" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="26" font-weight="860">三类能力证据同时交付</text>
  <text x="52" y="86" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="600">每次运行都留下 reviewer 能复核的界面痕迹，而不是只给一个自动化结论。</text>

  <!-- ===== Card 1: Inline Comment ===== -->
  <g filter="url(#cardShadow)">
    <rect x="52" y="124" width="332" height="310" rx="16" fill="url(#card1)" stroke="#101014" stroke-opacity="0.1"/>
  </g>
  <rect x="80" y="152" width="82" height="28" rx="8" fill="#ffcc8a"/>
  <text x="96" y="171" fill="#2f190e" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="850">Inline</text>
  <text x="80" y="214" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="860">changed-line comment</text>

  <!-- Code review preview -->
  <rect x="80" y="240" width="276" height="128" rx="12" fill="#f7f8f8" stroke="#101014" stroke-opacity="0.06"/>
  <text x="100" y="266" fill="#676b74" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" font-weight="700">src/auth.py</text>
  <rect x="100" y="282" width="228" height="6" rx="3" fill="#101014" opacity="0.08"/>
  <rect x="100" y="300" width="238" height="22" rx="6" fill="#c8ff62" opacity="0.35"/>
  <text x="110" y="315" fill="#101014" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" font-weight="700">+ default_role changed</text>

  <!-- Comment bubble -->
  <path d="M334 328c20 0 20 36 0 36H186c-20 0-20-36 0-36" fill="#fff" stroke="#2736ee" stroke-opacity="0.25" stroke-width="1.5"/>
  <text x="200" y="351" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="800">建议验证角色来源</text>

  <rect x="80" y="390" width="160" height="28" rx="8" fill="#c8ff62"/>
  <text x="98" y="409" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">📍 只落在 changed line</text>

  <!-- Arrow 1→2 -->
  <path d="M386 280H418" fill="none" stroke="#2736ee" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- ===== Card 2: Run Summary ===== -->
  <g filter="url(#cardShadowDark)">
    <rect x="434" y="124" width="332" height="310" rx="16" fill="url(#card2)"/>
    <rect x="434" y="124" width="332" height="3" rx="1.5" fill="#c8ff62" opacity="0.3"/>
  </g>
  <rect x="462" y="152" width="98" height="28" rx="8" fill="#ddd5e9"/>
  <text x="480" y="171" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="850">Artifact</text>
  <text x="462" y="214" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="860">run summary</text>

  <rect x="462" y="246" width="276" height="46" rx="10" fill="#fff" opacity="0.08"/>
  <circle cx="484" cy="269" r="5" fill="#c8ff62" opacity="0.6"/>
  <text x="500" y="274" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">status: completed with findings</text>

  <rect x="462" y="306" width="276" height="46" rx="10" fill="#fff" opacity="0.08"/>
  <circle cx="484" cy="329" r="5" fill="#c8ff62" opacity="0.6"/>
  <text x="500" y="334" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">tool calls: diff / tests / logs</text>

  <rect x="462" y="374" width="126" height="28" rx="8" fill="#c8ff62"/>
  <text x="482" y="393" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">✓ 可复盘</text>
  <rect x="602" y="374" width="114" height="28" rx="8" fill="#fff" opacity="0.1"/>
  <text x="622" y="393" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">⬇ 可下载</text>

  <!-- Arrow 2→3 -->
  <path d="M768 280H800" fill="none" stroke="#2736ee" stroke-width="2" marker-end="url(#arrowR)"/>

  <!-- ===== Card 3: GitHub Soft Check ===== -->
  <g filter="url(#cardShadow)">
    <rect x="816" y="124" width="332" height="310" rx="16" fill="url(#card1)" stroke="#101014" stroke-opacity="0.1"/>
  </g>
  <rect x="844" y="152" width="100" height="28" rx="8" fill="#c8ff62"/>
  <text x="862" y="171" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="850">Neutral</text>
  <text x="844" y="214" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="860">GitHub soft check</text>

  <!-- Check preview -->
  <rect x="844" y="244" width="276" height="126" rx="12" fill="#f7f8f8" stroke="#101014" stroke-opacity="0.06"/>
  <circle cx="878" cy="288" r="20" fill="#c8ff62"/>
  <path d="M869 288l9 9 19-26" fill="none" stroke="#101014" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="910" y="284" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="860">MergeWarden</text>
  <text x="910" y="304" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="600">neutral conclusion</text>
  <rect x="866" y="328" width="130" height="20" rx="6" fill="#ddd5e9"/>
  <text x="880" y="342" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="10" font-weight="800">不会阻断 merge</text>

  <rect x="844" y="392" width="248" height="28" rx="8" fill="#fff8f5" stroke="#ff765a" stroke-opacity="0.18"/>
  <text x="862" y="411" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">branch protection + CI 继续决策</text>

  <!-- ===== BOTTOM Rules ===== -->
  <g filter="url(#cardShadow)">
    <rect x="170" y="478" width="860" height="52" rx="14" fill="#fff" stroke="#101014" stroke-opacity="0.08"/>
  </g>
  <text x="204" y="510" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="15" font-weight="860">共同规则:</text>

  <rect x="320" y="490" width="146" height="28" rx="8" fill="#eee9f6"/>
  <text x="338" y="509" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="800">不自动 approve</text>

  <rect x="484" y="490" width="146" height="28" rx="8" fill="#c8ff62" opacity="0.5"/>
  <text x="500" y="509" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="800">建议附带证据</text>

  <rect x="648" y="490" width="296" height="28" rx="8" fill="#fff8f5" stroke="#ff765a" stroke-opacity="0.18"/>
  <text x="664" y="509" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="800">不替代 CI / branch protection</text>
</svg>
