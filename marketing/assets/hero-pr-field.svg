<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 640" role="img" aria-label="PR review evidence field">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#f2eff8"/>
      <stop offset="1" stop-color="#f4f7ef"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8ffb5"/>
      <stop offset="1" stop-color="#c8ff62"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b24"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#15161d" flood-opacity="0.12"/>
    </filter>
    <filter id="shadowLight" x="-8%" y="-8%" width="116%" height="122%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#15161d" flood-opacity="0.06"/>
    </filter>
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#101014" opacity="0.04"/>
    </pattern>
  </defs>

  <!-- Main plate -->
  <rect x="44" y="32" width="752" height="560" rx="28" fill="url(#bgGrad)" stroke="#101014" stroke-opacity="0.1"/>
  <rect x="44" y="32" width="752" height="560" rx="28" fill="url(#grid)"/>

  <!-- Subtle decorative arcs -->
  <ellipse cx="420" cy="580" rx="340" ry="120" fill="#c8ff62" opacity="0.05"/>
  <ellipse cx="700" cy="80" rx="200" ry="140" fill="#ddd5e9" opacity="0.08"/>

  <!-- Left: Code diff panel -->
  <g filter="url(#shadow)">
    <rect x="92" y="92" width="370" height="340" rx="14" fill="#fff" stroke="#101014" stroke-opacity="0.1"/>
    <!-- Header -->
    <rect x="92" y="92" width="370" height="52" rx="14" fill="#f6f7f8"/>
    <rect x="92" y="130" width="370" height="14" fill="#f6f7f8"/>
    <!-- Traffic dots -->
    <circle cx="120" cy="118" r="6" fill="#ff765a"/>
    <circle cx="140" cy="118" r="6" fill="#ffc145"/>
    <circle cx="160" cy="118" r="6" fill="#c8ff62"/>
    <text x="190" y="124" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="700">src/auth/session.ts</text>
    <!-- Code lines -->
    <rect x="120" y="168" width="290" height="14" rx="7" fill="#101014" opacity="0.08"/>
    <rect x="120" y="200" width="240" height="14" rx="7" fill="#c8ff62" opacity="0.35"/>
    <rect x="120" y="232" width="300" height="14" rx="7" fill="#ff765a" opacity="0.2"/>
    <rect x="120" y="264" width="210" height="14" rx="7" fill="#2736ee" opacity="0.12"/>
    <rect x="120" y="296" width="268" height="14" rx="7" fill="#101014" opacity="0.06"/>
    <rect x="120" y="328" width="180" height="14" rx="7" fill="#101014" opacity="0.08"/>
    <rect x="120" y="360" width="256" height="14" rx="7" fill="#101014" opacity="0.06"/>
  </g>

  <!-- Right: Dark analysis panel -->
  <g filter="url(#shadow)">
    <rect x="420" y="198" width="320" height="286" rx="14" fill="url(#darkCard)"/>
  </g>
  <!-- Analysis content -->
  <rect x="448" y="226" width="80" height="18" rx="6" fill="#ddd5e9"/>
  <text x="458" y="239" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="10" font-weight="800">分析中</text>

  <!-- Scan lines -->
  <rect x="448" y="264" width="260" height="6" rx="3" fill="#fff" opacity="0.1"/>
  <rect x="448" y="282" width="220" height="6" rx="3" fill="#c8ff62" opacity="0.4"/>
  <rect x="448" y="300" width="180" height="6" rx="3" fill="#fff" opacity="0.1"/>
  <rect x="448" y="318" width="240" height="6" rx="3" fill="#ff765a" opacity="0.3"/>

  <!-- Finding card inside dark panel -->
  <rect x="448" y="348" width="264" height="60" rx="10" fill="#fff" opacity="0.06"/>
  <rect x="464" y="366" width="56" height="20" rx="5" fill="#c8ff62" opacity="0.3"/>
  <text x="472" y="380" fill="#c8ff62" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="10" font-weight="800">发现</text>
  <rect x="528" y="366" width="156" height="6" rx="3" fill="#fff" opacity="0.3"/>
  <rect x="528" y="382" width="120" height="6" rx="3" fill="#fff" opacity="0.15"/>

  <!-- Bottom: Evidence flow -->
  <path d="M196 488c100-72 170-72 270 0s170 72 270 0" fill="none" stroke="url(#greenGlow)" stroke-width="18" stroke-linecap="round" opacity="0.7"/>

  <!-- Three nodes on the curve -->
  <circle cx="198" cy="488" r="16" fill="#c8ff62" stroke="#101014" stroke-opacity="0.12" stroke-width="2"/>
  <text x="190" y="494" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="900">A</text>

  <circle cx="466" cy="488" r="16" fill="#ddd5e9" stroke="#101014" stroke-opacity="0.12" stroke-width="2"/>
  <text x="458" y="494" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="900">B</text>

  <circle cx="736" cy="488" r="16" fill="#ff765a" stroke="#101014" stroke-opacity="0.1" stroke-width="2"/>
  <text x="729" y="494" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="900">C</text>

  <!-- Labels below nodes -->
  <text x="170" y="528" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="700">diff 证据</text>
  <text x="440" y="528" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="700">日志验证</text>
  <text x="708" y="528" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="700">advisory</text>
</svg>
