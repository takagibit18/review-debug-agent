<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Workflow demo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafbfc"/>
      <stop offset="0.5" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#eee9f6"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b24"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="card4top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0faf0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-10%" width="116%" height="126%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#15161d" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadowDark" x="-8%" y="-10%" width="116%" height="126%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#15161d" flood-opacity="0.2"/>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2736ee"/>
    </marker>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#101014" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  <rect width="1200" height="720" fill="url(#dots)"/>

  <ellipse cx="600" cy="680" rx="400" ry="60" fill="#c8ff62" opacity="0.06"/>
  <ellipse cx="100" cy="200" rx="140" ry="100" fill="#ddd5e9" opacity="0.1"/>

  <text x="56" y="58" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="28" font-weight="860">四步 advisory 发布链路</text>
  <text x="56" y="90" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="15" font-weight="600">从 PR diff 到 GitHub neutral check，所有自动化输出都保留为建议和证据。</text>

  <!-- ===== STEP 1: Read PR diff ===== -->
  <g filter="url(#cardShadow)">
    <rect x="54" y="138" width="244" height="332" rx="16" fill="url(#card1)" stroke="#101014" stroke-opacity="0.1"/>
  </g>
  <circle cx="88" cy="180" r="20" fill="#c8ff62"/>
  <text x="80" y="188" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="18" font-weight="900">1</text>
  <text x="120" y="186" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="17" font-weight="860">读取 PR diff</text>

  <text x="78" y="226" fill="#676b74" font-family="'SFMono-Regular',Consolas,monospace" font-size="12" font-weight="700">changed_lines.json</text>

  <!-- Code diff snippet -->
  <rect x="78" y="248" width="192" height="24" rx="6" fill="#101014" opacity="0.06"/>
  <text x="88" y="264" fill="#676b74" font-family="'SFMono-Regular',Consolas,monospace" font-size="10">- legacy guard check</text>

  <rect x="78" y="284" width="192" height="24" rx="6" fill="#c8ff62" opacity="0.35"/>
  <text x="88" y="300" fill="#101014" font-family="'SFMono-Regular',Consolas,monospace" font-size="10" font-weight="700">+ src/auth.py line 46</text>

  <rect x="78" y="320" width="140" height="24" rx="6" fill="#ff765a" opacity="0.12"/>
  <text x="88" y="336" fill="#676b74" font-family="'SFMono-Regular',Consolas,monospace" font-size="10">~ route config</text>

  <!-- Bottom badge -->
  <rect x="78" y="370" width="170" height="32" rx="8" fill="#eee9f6"/>
  <text x="94" y="391" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">🔍 仅锁定变更行</text>

  <!-- arrow 1→2 -->
  <path d="M300 304H326" fill="none" stroke="#2736ee" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowR)"/>

  <!-- ===== STEP 2: Collect Evidence ===== -->
  <g filter="url(#cardShadowDark)">
    <rect x="334" y="138" width="244" height="332" rx="16" fill="url(#card2)"/>
    <rect x="334" y="138" width="244" height="3" rx="1.5" fill="#c8ff62" opacity="0.3"/>
  </g>
  <circle cx="368" cy="180" r="20" fill="#ddd5e9"/>
  <text x="360" y="188" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="18" font-weight="900">2</text>
  <text x="400" y="186" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="17" font-weight="860">按需收集证据</text>

  <text x="358" y="224" fill="#c8ff62" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">read-only 工具链</text>

  <rect x="358" y="250" width="192" height="42" rx="10" fill="#fff" opacity="0.08"/>
  <circle cx="378" cy="271" r="4" fill="#c8ff62" opacity="0.6"/>
  <text x="392" y="276" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">相邻代码上下文</text>

  <rect x="358" y="304" width="192" height="42" rx="10" fill="#fff" opacity="0.08"/>
  <circle cx="378" cy="325" r="4" fill="#c8ff62" opacity="0.6"/>
  <text x="392" y="330" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">pytest / CI log</text>

  <rect x="358" y="358" width="192" height="42" rx="10" fill="#fff" opacity="0.08"/>
  <circle cx="378" cy="379" r="4" fill="#c8ff62" opacity="0.6"/>
  <text x="392" y="384" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">运行摘要 artifact</text>

  <rect x="358" y="420" width="148" height="28" rx="8" fill="#c8ff62" opacity="0.12"/>
  <text x="376" y="439" fill="#c8ff62" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="800">← 复用仓库边界</text>

  <!-- arrow 2→3 -->
  <path d="M580 304H606" fill="none" stroke="#2736ee" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowR)"/>

  <!-- ===== STEP 3: Structured Finding ===== -->
  <g filter="url(#cardShadow)">
    <rect x="614" y="138" width="244" height="332" rx="16" fill="url(#card1)" stroke="#101014" stroke-opacity="0.1"/>
  </g>
  <circle cx="648" cy="180" r="20" fill="#ff765a"/>
  <text x="640" y="188" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="18" font-weight="900">3</text>
  <text x="680" y="186" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="17" font-weight="860">结构化 finding</text>

  <text x="638" y="224" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="700">severity / evidence / suggestion</text>

  <!-- Finding structure preview -->
  <rect x="638" y="250" width="78" height="26" rx="7" fill="#ffcc8a"/>
  <text x="652" y="268" fill="#2f190e" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">medium</text>

  <rect x="638" y="292" width="184" height="8" rx="4" fill="#101014" opacity="0.08"/>
  <rect x="638" y="312" width="154" height="8" rx="4" fill="#101014" opacity="0.06"/>
  <rect x="638" y="332" width="170" height="8" rx="4" fill="#2736ee" opacity="0.15"/>

  <rect x="638" y="360" width="100" height="26" rx="7" fill="#c8ff62"/>
  <text x="656" y="378" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">可定位 ✓</text>

  <rect x="750" y="360" width="80" height="26" rx="7" fill="#eee9f6"/>
  <text x="764" y="378" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">confidence</text>

  <!-- arrow 3→4 -->
  <path d="M860 304H886" fill="none" stroke="#2736ee" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowR)"/>

  <!-- ===== STEP 4: Publish Soft Check ===== -->
  <g filter="url(#cardShadow)">
    <rect x="894" y="138" width="252" height="332" rx="16" fill="url(#card4top)" stroke="#101014" stroke-opacity="0.1"/>
  </g>
  <circle cx="928" cy="180" r="20" fill="#c8ff62"/>
  <text x="920" y="188" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="18" font-weight="900">4</text>
  <text x="960" y="186" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="17" font-weight="860">发布 soft check</text>

  <!-- GitHub check preview -->
  <rect x="918" y="230" width="200" height="140" rx="12" fill="#fff" stroke="#101014" stroke-opacity="0.08"/>
  <circle cx="950" cy="266" r="18" fill="#c8ff62"/>
  <path d="M942 266l8 8 18-22" fill="none" stroke="#101014" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="980" y="262" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="860">MergeWarden</text>
  <text x="980" y="282" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="600">neutral conclusion</text>

  <!-- Not a hard gate badge -->
  <rect x="940" y="308" width="124" height="22" rx="7" fill="#ddd5e9"/>
  <text x="956" y="323" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="10" font-weight="800">not a hard gate</text>

  <!-- Status lines -->
  <rect x="940" y="342" width="142" height="6" rx="3" fill="#101014" opacity="0.1"/>
  <rect x="940" y="354" width="98" height="6" rx="3" fill="#101014" opacity="0.08"/>

  <rect x="918" y="396" width="190" height="34" rx="9" fill="#101014"/>
  <text x="938" y="418" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="800">✓ 回写 PR，不接管合并</text>

  <!-- ===== BOTTOM: Responsibility Boundary ===== -->
  <g filter="url(#cardShadow)">
    <rect x="120" y="540" width="960" height="78" rx="14" fill="#fff" stroke="#101014" stroke-opacity="0.08"/>
  </g>

  <text x="156" y="576" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="16" font-weight="860">责任边界</text>

  <rect x="270" y="552" width="192" height="42" rx="10" fill="#eee9f6"/>
  <text x="288" y="578" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="800">CLI / FastAPI 产出证据</text>

  <rect x="480" y="552" width="196" height="42" rx="10" fill="#c8ff62" opacity="0.5"/>
  <text x="498" y="578" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="800">Actions 只发布 advisory</text>

  <rect x="694" y="552" width="310" height="42" rx="10" fill="#fff8f5" stroke="#ff765a" stroke-opacity="0.18"/>
  <text x="712" y="578" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="800">CI / branch protection 仍是 hard gate</text>

  <rect x="56" y="670" width="1088" height="1" rx="0.5" fill="#101014" opacity="0.06"/>
</svg>
