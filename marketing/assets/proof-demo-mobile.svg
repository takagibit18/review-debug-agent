<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 980" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Proof demo mobile">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafbfc"/>
      <stop offset="0.5" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#eee9f6"/>
    </linearGradient>
    <linearGradient id="lightCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f9fafb"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b24"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <filter id="cardShadow" x="-6%" y="-8%" width="112%" height="122%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#15161d" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadowDark" x="-6%" y="-8%" width="112%" height="122%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#15161d" flood-opacity="0.18"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#101014" opacity="0.05"/>
    </pattern>
  </defs>

  <rect width="720" height="980" fill="url(#bgGrad)"/>
  <rect width="720" height="980" fill="url(#dots)"/>

  <ellipse cx="560" cy="100" rx="160" ry="90" fill="#c8ff62" opacity="0.06"/>
  <ellipse cx="120" cy="880" rx="150" ry="70" fill="#ddd5e9" opacity="0.1"/>

  <text x="42" y="54" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="26" font-weight="860">三类能力证据同时交付</text>
  <text x="42" y="84" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="600">移动端用竖向证据卡，重点信息不被横向压缩。</text>

  <!-- Card 1: Inline -->
  <g filter="url(#cardShadow)">
    <rect x="42" y="120" width="636" height="180" rx="16" fill="url(#lightCard)" stroke="#101014" stroke-opacity="0.1"/>
  </g>
  <rect x="72" y="148" width="78" height="26" rx="7" fill="#ffcc8a"/>
  <text x="88" y="166" fill="#2f190e" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="850">Inline</text>
  <text x="72" y="202" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="860">changed-line comment</text>

  <rect x="72" y="228" width="400" height="20" rx="5" fill="#c8ff62" opacity="0.35"/>
  <text x="84" y="242" fill="#101014" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" font-weight="700">+ default_role changed</text>

  <rect x="72" y="262" width="220" height="24" rx="7" fill="#eee9f6"/>
  <text x="88" y="279" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">📍 只落在 changed line</text>

  <!-- Card 2: Artifact -->
  <g filter="url(#cardShadowDark)">
    <rect x="42" y="344" width="636" height="180" rx="16" fill="url(#darkCard)"/>
    <rect x="42" y="344" width="636" height="3" rx="1.5" fill="#c8ff62" opacity="0.3"/>
  </g>
  <rect x="72" y="372" width="98" height="26" rx="7" fill="#ddd5e9"/>
  <text x="90" y="390" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="850">Artifact</text>
  <text x="72" y="426" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="860">run summary</text>

  <rect x="72" y="454" width="380" height="34" rx="9" fill="#fff" opacity="0.08"/>
  <circle cx="92" cy="471" r="4" fill="#c8ff62" opacity="0.5"/>
  <text x="106" y="476" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">status / tool calls / publish result</text>

  <rect x="468" y="454" width="100" height="34" rx="9" fill="#c8ff62"/>
  <text x="484" y="476" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">✓ 可复盘</text>

  <!-- Card 3: Neutral -->
  <g filter="url(#cardShadow)">
    <rect x="42" y="568" width="636" height="180" rx="16" fill="url(#lightCard)" stroke="#101014" stroke-opacity="0.1"/>
  </g>
  <rect x="72" y="596" width="96" height="26" rx="7" fill="#c8ff62"/>
  <text x="90" y="614" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="850">Neutral</text>
  <text x="72" y="650" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="860">GitHub soft check</text>
  <text x="72" y="680" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="600">neutral conclusion，不改变合并权限。</text>

  <rect x="72" y="704" width="320" height="24" rx="7" fill="#fff8f5" stroke="#ff765a" stroke-opacity="0.18"/>
  <text x="88" y="721" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">CI / branch protection 继续决策</text>

  <!-- Bottom rules -->
  <g filter="url(#cardShadow)">
    <rect x="68" y="808" width="584" height="52" rx="14" fill="#fff" stroke="#101014" stroke-opacity="0.08"/>
  </g>
  <text x="100" y="840" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="15" font-weight="860">共同规则: 不自动 approve，只提交证据和建议。</text>

  <rect x="42" y="902" width="636" height="1" rx="0.5" fill="#101014" opacity="0.06"/>
</svg>
