<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Evidence demo">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fafbfc"/>
      <stop offset="0.5" stop-color="#f3f4f6"/>
      <stop offset="1" stop-color="#eee9f6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fafbfc"/>
    </linearGradient>
    <linearGradient id="darkCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1b24"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c8ff62" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2736ee" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="blueLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2736ee" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#2736ee"/>
      <stop offset="1" stop-color="#2736ee" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#15161d" flood-opacity="0.08"/>
    </filter>
    <filter id="cardShadowStrong" x="-8%" y="-12%" width="116%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#15161d" flood-opacity="0.14"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#c8ff62" flood-opacity="0.4"/>
    </filter>
    <filter id="glowBlue" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#2736ee" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowR" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#2736ee"/>
    </marker>
    <pattern id="dots" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#101014" opacity="0.06"/>
    </pattern>
    <clipPath id="cardClip1"><rect x="56" y="138" width="294" height="154" rx="14"/></clipPath>
    <clipPath id="cardClip2"><rect x="56" y="314" width="294" height="154" rx="14"/></clipPath>
    <clipPath id="cardClip3"><rect x="56" y="490" width="294" height="148" rx="14"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="720" fill="url(#bgGrad)"/>
  <rect width="1200" height="720" fill="url(#dots)"/>

  <!-- Subtle decorative blobs -->
  <ellipse cx="980" cy="120" rx="180" ry="120" fill="#c8ff62" opacity="0.08"/>
  <ellipse cx="200" cy="620" rx="220" ry="100" fill="#ddd5e9" opacity="0.12"/>
  <ellipse cx="600" cy="380" rx="160" ry="140" fill="#2736ee" opacity="0.04"/>

  <!-- Title area -->
  <text x="56" y="62" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="28" font-weight="860">证据缺口如何被补齐</text>
  <text x="56" y="96" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="15" font-weight="600">PR diff、失败日志、运行摘要汇入同一条 advisory finding，避免 reviewer 只看到模糊提醒。</text>

  <!-- ===== LEFT COLUMN: 3 Input Cards ===== -->

  <!-- Card 1: PR Diff -->
  <g filter="url(#cardShadow)">
    <rect x="56" y="138" width="294" height="154" rx="14" fill="url(#cardGrad)" stroke="#101014" stroke-opacity="0.1"/>
    <rect x="56" y="138" width="294" height="44" rx="14" fill="#101014"/>
    <rect x="56" y="168" width="294" height="14" fill="#101014"/>
  </g>
  <text x="78" y="166" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="800">01  PR diff</text>
  <!-- Code-like content -->
  <text x="78" y="214" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="15" font-weight="800">auth.py 第 46 行改动</text>
  <rect x="78" y="232" width="236" height="22" rx="6" fill="#c8ff62" opacity="0.4"/>
  <text x="88" y="247" fill="#101014" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" font-weight="700">+ allow_guest = config.default_role</text>
  <rect x="78" y="264" width="156" height="8" rx="4" fill="#101014" opacity="0.1"/>

  <!-- Card 2: Test Failure Log -->
  <g filter="url(#cardShadow)">
    <rect x="56" y="314" width="294" height="154" rx="14" fill="url(#cardGrad)" stroke="#101014" stroke-opacity="0.1"/>
    <rect x="56" y="314" width="294" height="44" rx="14" fill="#ddd5e9"/>
    <rect x="56" y="344" width="294" height="14" fill="#ddd5e9"/>
  </g>
  <text x="78" y="342" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="800">02  测试失败日志</text>
  <!-- Log-like content -->
  <rect x="78" y="378" width="196" height="10" rx="5" fill="#101014" opacity="0.1"/>
  <rect x="78" y="398" width="240" height="10" rx="5" fill="#101014" opacity="0.08"/>
  <rect x="78" y="420" width="212" height="26" rx="8" fill="#ff765a" opacity="0.22"/>
  <text x="90" y="438" fill="#101014" font-family="'SFMono-Regular',Consolas,monospace" font-size="11" font-weight="700">FAILED: test_guest_role_bypass</text>

  <!-- Card 3: Run Summary -->
  <g filter="url(#cardShadow)">
    <rect x="56" y="490" width="294" height="148" rx="14" fill="url(#cardGrad)" stroke="#101014" stroke-opacity="0.1"/>
    <rect x="56" y="490" width="294" height="44" rx="14" fill="#ffcc8a"/>
    <rect x="56" y="520" width="294" height="14" fill="#ffcc8a"/>
  </g>
  <text x="78" y="518" fill="#2f190e" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="800">03  run summary</text>
  <text x="78" y="566" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="15" font-weight="800">工具调用与停止原因</text>
  <rect x="78" y="586" width="104" height="26" rx="8" fill="#c8ff62"/>
  <text x="92" y="604" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">evidence ✓</text>
  <rect x="194" y="586" width="90" height="26" rx="8" fill="#eee9f6"/>
  <text x="208" y="604" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800">soft only</text>

  <!-- ===== CENTER: MergeWarden Router ===== -->
  <g filter="url(#cardShadowStrong)">
    <rect x="440" y="176" width="316" height="388" rx="16" fill="url(#darkCard)"/>
  </g>
  <!-- Glow accent line at top -->
  <rect x="440" y="176" width="316" height="3" rx="1.5" fill="url(#accentGlow)"/>

  <!-- Brand area -->
  <rect x="468" y="204" width="38" height="38" rx="10" fill="#c8ff62"/>
  <text x="478" y="230" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="900">M</text>
  <text x="518" y="232" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="22" font-weight="860">MergeWarden</text>
  <text x="468" y="268" fill="#c8ff62" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="800">证据路由器</text>

  <!-- Processing steps -->
  <rect x="468" y="298" width="260" height="42" rx="10" fill="#fff" opacity="0.08"/>
  <circle cx="488" cy="319" r="5" fill="#c8ff62"/>
  <text x="502" y="324" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700">changed line 精准匹配</text>

  <rect x="468" y="352" width="260" height="42" rx="10" fill="#fff" opacity="0.08"/>
  <circle cx="488" cy="373" r="5" fill="#c8ff62"/>
  <text x="502" y="378" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700">日志与 diff 交叉验证</text>

  <rect x="468" y="406" width="260" height="42" rx="10" fill="#fff" opacity="0.08"/>
  <circle cx="488" cy="427" r="5" fill="#c8ff62"/>
  <text x="502" y="432" fill="#fff" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="700">不可定位 → 写入 summary</text>

  <!-- Confidence meter -->
  <rect x="468" y="476" width="260" height="6" rx="3" fill="#fff" opacity="0.12"/>
  <rect x="468" y="476" width="200" height="6" rx="3" fill="#c8ff62"/>
  <text x="468" y="506" fill="#fff" opacity="0.6" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="600">confidence</text>
  <text x="690" y="506" fill="#c8ff62" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="800">0.82</text>

  <!-- ===== RIGHT: Output Finding ===== -->
  <g filter="url(#cardShadowStrong)">
    <rect x="842" y="140" width="304" height="450" rx="16" fill="#fff" stroke="#101014" stroke-opacity="0.1"/>
  </g>

  <!-- Severity tag -->
  <rect x="872" y="168" width="66" height="28" rx="8" fill="#ffcc8a"/>
  <text x="888" y="188" fill="#2f190e" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="850">⚠ 风险</text>

  <!-- Finding title -->
  <text x="872" y="234" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="20" font-weight="860">授权默认值改变</text>
  <text x="872" y="264" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="700">📍 src/auth.py:46</text>

  <!-- Evidence A -->
  <rect x="872" y="290" width="246" height="58" rx="10" fill="#f7f8f8" stroke="#101014" stroke-opacity="0.06"/>
  <rect x="888" y="306" width="32" height="24" rx="6" fill="#c8ff62"/>
  <text x="900" y="323" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="900">A</text>
  <text x="932" y="316" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="800">diff 引入默认角色</text>
  <text x="932" y="336" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="600">changed line 可定位评论</text>

  <!-- Evidence B -->
  <rect x="872" y="362" width="246" height="58" rx="10" fill="#fff8f5" stroke="#ff765a" stroke-opacity="0.18"/>
  <rect x="888" y="378" width="32" height="24" rx="6" fill="#ff765a" opacity="0.4"/>
  <text x="900" y="395" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="900">B</text>
  <text x="932" y="388" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="800">pytest 失败日志</text>
  <text x="932" y="408" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="600">guest role bypass</text>

  <!-- Evidence C / Suggestion -->
  <rect x="872" y="434" width="246" height="58" rx="10" fill="#f6f4ff" stroke="#2736ee" stroke-opacity="0.12"/>
  <rect x="888" y="450" width="32" height="24" rx="6" fill="#2736ee" opacity="0.15"/>
  <text x="898" y="467" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="900">→</text>
  <text x="932" y="460" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="14" font-weight="800">reviewer 验证角色来源</text>
  <text x="932" y="480" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="600">建议不替代审批</text>

  <!-- Action button -->
  <rect x="872" y="518" width="180" height="36" rx="10" fill="#c8ff62"/>
  <text x="908" y="542" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="13" font-weight="850">发布到 PR summary →</text>

  <!-- ===== CONNECTOR ARROWS ===== -->
  <!-- Arrow 1: diff → router -->
  <path d="M350 215C388 215 390 270 434 286" fill="none" stroke="#2736ee" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.5"/>
  <path d="M350 215C388 215 390 270 434 286" fill="none" stroke="#2736ee" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrowR)"/>

  <!-- Arrow 2: log → router -->
  <path d="M350 391C394 391 392 386 434 386" fill="none" stroke="#2736ee" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.5"/>
  <path d="M350 391C394 391 392 386 434 386" fill="none" stroke="#2736ee" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrowR)"/>

  <!-- Arrow 3: summary → router -->
  <path d="M350 564C388 564 390 510 434 486" fill="none" stroke="#2736ee" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.5"/>
  <path d="M350 564C388 564 390 510 434 486" fill="none" stroke="#2736ee" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrowR)"/>

  <!-- Arrow 4: router → output -->
  <path d="M760 370C792 370 806 370 836 370" fill="none" stroke="#2736ee" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="6 4" opacity="0.5"/>
  <path d="M760 370C792 370 806 370 836 370" fill="none" stroke="#2736ee" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrowR)"/>

  <!-- Labels on arrows -->
  <g font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="800" fill="#2736ee">
    <rect x="374" y="192" width="40" height="20" rx="5" fill="#fff" opacity="0.8"/>
    <text x="380" y="206">收集</text>
    <rect x="374" y="372" width="40" height="20" rx="5" fill="#fff" opacity="0.8"/>
    <text x="380" y="386">互证</text>
    <rect x="374" y="544" width="40" height="20" rx="5" fill="#fff" opacity="0.8"/>
    <text x="380" y="558">留痕</text>
    <rect x="772" y="352" width="68" height="20" rx="5" fill="#fff" opacity="0.8"/>
    <text x="778" y="366">结构化输出</text>
  </g>

  <!-- Bottom decorative line -->
  <rect x="56" y="672" width="1088" height="1" rx="0.5" fill="#101014" opacity="0.06"/>
</svg>
