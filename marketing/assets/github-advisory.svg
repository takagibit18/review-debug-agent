<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 680" role="img" aria-label="GitHub advisory scene">
  <defs>
    <linearGradient id="darkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181922"/>
      <stop offset="1" stop-color="#0d0d12"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8f9fb"/>
      <stop offset="1" stop-color="#f0f1f4"/>
    </linearGradient>
    <linearGradient id="sidebarDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16171f"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <filter id="panelShadow" x="-10%" y="-10%" width="120%" height="126%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="glowGreen" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#c8ff62" flood-opacity="0.4"/>
    </filter>
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.8" fill="#fff" opacity="0.03"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="860" height="680" fill="url(#darkBg)"/>
  <rect width="860" height="680" fill="url(#grid)"/>

  <!-- Subtle glow -->
  <ellipse cx="430" cy="340" rx="350" ry="250" fill="#c8ff62" opacity="0.03"/>

  <!-- X decoration (top right) -->
  <path d="M752 72l36 36M788 72l-36 36" stroke="#2736ee" stroke-width="8" stroke-linecap="round" opacity="0.5"/>

  <!-- ===== Main PR Panel ===== -->
  <g filter="url(#panelShadow)">
    <rect x="92" y="78" width="676" height="522" rx="18" fill="url(#panelBg)" stroke="#fff" stroke-opacity="0.08"/>
    <!-- Header bar -->
    <rect x="92" y="78" width="676" height="64" rx="18" fill="#fff"/>
    <rect x="92" y="128" width="676" height="14" fill="#fff"/>
    <!-- Traffic dots -->
    <circle cx="124" cy="110" r="7" fill="#ff765a"/>
    <circle cx="146" cy="110" r="7" fill="#ffc145"/>
    <circle cx="168" cy="110" r="7" fill="#c8ff62"/>
    <!-- Tab/title -->
    <rect x="210" y="96" width="220" height="28" rx="8" fill="#101014" opacity="0.08"/>
    <text x="226" y="115" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="700">MergeWarden · PR #42</text>
  </g>

  <!-- ===== Left: File tree sidebar ===== -->
  <rect x="116" y="172" width="220" height="378" rx="12" fill="url(#sidebarDark)"/>
  <!-- File lines -->
  <rect x="140" y="198" width="160" height="6" rx="3" fill="#fff" opacity="0.15"/>
  <rect x="140" y="220" width="140" height="6" rx="3" fill="#c8ff62" opacity="0.4"/>
  <rect x="140" y="248" width="120" height="6" rx="3" fill="#fff" opacity="0.12"/>
  <rect x="140" y="276" width="150" height="6" rx="3" fill="#fff" opacity="0.15"/>
  <rect x="140" y="304" width="130" height="6" rx="3" fill="#ff765a" opacity="0.3"/>
  <rect x="140" y="332" width="155" height="6" rx="3" fill="#fff" opacity="0.12"/>
  <rect x="140" y="360" width="110" height="6" rx="3" fill="#fff" opacity="0.15"/>
  <rect x="140" y="388" width="145" height="6" rx="3" fill="#fff" opacity="0.12"/>
  <rect x="140" y="416" width="125" height="6" rx="3" fill="#fff" opacity="0.15"/>

  <!-- Highlighted file -->
  <rect x="128" y="236" width="194" height="24" rx="6" fill="#fff" opacity="0.06"/>

  <!-- ===== Right: Check panel ===== -->
  <!-- Check result card -->
  <rect x="366" y="178" width="370" height="100" rx="12" fill="#fff" stroke="#101014" stroke-opacity="0.08"/>
  <g filter="url(#glowGreen)">
    <circle cx="402" cy="228" r="20" fill="#c8ff62"/>
  </g>
  <path d="M394 228l8 8 18-22" fill="none" stroke="#101014" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="436" y="222" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="16" font-weight="860">MergeWarden advisory</text>
  <text x="436" y="244" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="600">neutral — 3 findings, 2 inline</text>

  <!-- Finding card 1 -->
  <rect x="366" y="298" width="370" height="120" rx="12" fill="#fff" stroke="#101014" stroke-opacity="0.08"/>
  <rect x="392" y="322" width="68" height="24" rx="7" fill="#ffcc8a"/>
  <text x="406" y="339" fill="#2f190e" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="850">⚠ 风险</text>
  <text x="472" y="338" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="15" font-weight="800">授权默认值改变</text>
  <rect x="392" y="362" width="300" height="6" rx="3" fill="#101014" opacity="0.06"/>
  <rect x="392" y="380" width="240" height="6" rx="3" fill="#101014" opacity="0.06"/>
  <rect x="392" y="398" width="180" height="6" rx="3" fill="#101014" opacity="0.04"/>

  <!-- Finding card 2 -->
  <rect x="366" y="434" width="370" height="100" rx="12" fill="#fff" stroke="#101014" stroke-opacity="0.08"/>
  <rect x="392" y="458" width="68" height="24" rx="7" fill="#ddd5e9"/>
  <text x="404" y="475" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="12" font-weight="850">ℹ 建议</text>
  <text x="472" y="474" fill="#101014" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="15" font-weight="800">未改动文件仅做上下文</text>
  <rect x="392" y="496" width="280" height="6" rx="3" fill="#101014" opacity="0.06"/>
  <rect x="392" y="514" width="210" height="6" rx="3" fill="#101014" opacity="0.04"/>

  <!-- Bottom status bar -->
  <rect x="366" y="554" width="370" height="28" rx="8" fill="#101014" opacity="0.04"/>
  <circle cx="388" cy="568" r="4" fill="#c8ff62"/>
  <text x="400" y="573" fill="#676b74" font-family="Inter,ui-sans-serif,system-ui,'Microsoft YaHei',sans-serif" font-size="11" font-weight="700">advisory run completed · 不阻断 merge</text>
</svg>
