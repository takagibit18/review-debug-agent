experiment_id: graph-ab-qwen-2x2-haystack
formal_graph_ab: false
held_out_executed: false
runtime_contract_source: current
seed: 20260815

# Qwen (DashScope/Bailian) 2x2 Haystack A/B smoke.
# 2 fixtures (Haystack #12257 + #12162) x (Agent Search x2 + Graph Warm x2)
# = 8 measured runs.  Resource envelope identical to graph-ab-development-28.
# B1-graph-hybrid-cold is intentionally skipped (per user scope).
# NOTE: model switched qwen3.6-flash -> qwen3.7-max-2026-05-20 because the
# qwen3.6-flash free quota was exhausted (403 insufficient_quota, confirmed
# via probe_bailian_auth.py). qwen3.7-max-2026-05-20 is the .env default and
# returned 200 OK on the same key/endpoint.
shared:
  model: qwen3.7-max-2026-05-20
  temperature: 0.0
  max_output_tokens: 4096
  prompt_input_token_budget: 12000
  token_budget: 60000
  token_hard_budget: 80000
  final_submit_reserve_tokens: 12000
  final_submit_prompt_token_budget: 4000
  final_submit_feedback_token_budget: 1200
  max_iterations: 3
  tool_budget: 64
  model_request_timeout_seconds: 180.0
  tool_timeout_seconds: 30.0
  run_timeout_seconds: 600.0

variants:
  - id: A-agent-search
    context_mode: agent_search
    graph_cache_mode: disabled
    samples: 2
  - id: B2-graph-hybrid-warm
    context_mode: graph_hybrid
    graph_cache_mode: warm
    requires_priming: true
    samples: 2

fixtures:
  - phase: validation
    path: eval/fixtures/golden_deepset-ai_haystack_pr12257_reverse.json
    types:
      - direct-cross-file
      - graph-sensitive
      - positive-sample
  - phase: validation
    path: eval/fixtures/golden_deepset-ai_haystack_pr12162_reverse.json
    types:
      - multi-hop
      - graph-sensitive
      - positive-sample
