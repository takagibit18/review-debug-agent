# =============================================================================
# Held-out final validation — Qwen relaxed runtime contract
# -----------------------------------------------------------------------------
# runtime_contract_source: current  -> _apply_runtime_contract() writes the
# `shared` block into os.environ, so every later fresh get_settings() reflects
# the EXACT relaxed budget previously verified on the Qwen development matrix.
#
# This is the FIX for the previous INVALID_RUNTIME_ATTEMPT: the earlier driver
# (run_heldout_qwen37max.py) called eval.runner.run_single directly and NEVER
# applied _apply_runtime_contract, so it silently fell back to the NARROW
# production defaults (token_budget=30000 / token_hard_budget=36000 /
# prompt_input_token_budget=32000 / model_max_tokens=2048). That is why every
# run hit budget_state=hard_capped at 42k-52k tokens (< the frozen 80000).
# =============================================================================
runtime_contract_source: current

shared:
  # --- provider / model -----------------------------------------------------
  # FROZEN DOC SPECIFIED: qwen3.7-max-2026-05-20
  # BUT that dated snapshot now returns HTTP 403 "Free quota exhausted" on this
  # DashScope endpoint+key (verified 2026-08-18). The only working model is
  # qwen3.7-max (the one the user set in .env on the prior turn). Using the
  # dated model would 403 on every call. This is a DOC/MODEL DEVIATION that
  # must be confirmed by the user before paid runs proceed.
  model: qwen3.7-max
  temperature: 0.0

  # --- output token ---------------------------------------------------------
  max_output_tokens: 4096

  # --- token budgets (RELAXED, NOT production defaults) ----------------------
  prompt_input_token_budget: 12000
  token_budget: 60000
  token_hard_budget: 80000
  final_submit_reserve_tokens: 12000
  final_submit_prompt_token_budget: 4000
  final_submit_feedback_token_budget: 1200

  # --- iteration / tool -----------------------------------------------------
  max_iterations: 3          # requested; effective cap may clamp to 2 (allowed)
  tool_budget: 64

  # --- timeouts -------------------------------------------------------------
  model_request_timeout_seconds: 180.0
  tool_timeout_seconds: 30.0
  run_timeout_seconds: 600.0
